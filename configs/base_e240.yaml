# Base model: 240 epochs from random initialisation on all 75 training patients.
# Reproduces the run recorded in e240_FINAL.pt (best epoch 229).
# Launch on 2 GPUs (batch 20 per GPU = effective 40):
#   python -m torch.distributed.run --nproc_per_node=2 \
#     scripts/train/train_doserad.py --config configs/base_e240.yaml --data-root <SHARDS>
run_name: base_e240
epochs: 240
batch_size: 20
lr: 3.0e-4
weight_decay: 1.0e-5
base_features: 24
levels: 5
arch: factorised
with_wepl: false
with_bragg: true
with_lateral: false
with_depth: false
rsp: hlut
peak_relative_loss: false
idd_weight: 0.05
grad_accum: 1
amp: bf16
val_beamlets: 2000
save_state_every: 3200
wandb: false
workers: 6
log_every: 50
checkpoint_dir: checkpoints
# All 75 patients. val_patients is left unset, so the registry's 6 validation
# patients (models/splits.py) are monitored -- and are inside this training set.
train_patients:
